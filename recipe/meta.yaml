{% set name = "predictr" %}
{% set version = "0.1.34" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/predictr-{{ version }}.tar.gz
  sha256: 13a9c50e0d4ea09759bbc7d5be8a206d1ed3125784fc435a7dcd3c8abb3df7bf

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - matplotlib-base >=2.2.0
    - numpy >=1.16.0
    - pandas >=1.0.0
    - python >={{ python_min }}
    - scipy >=1.3.0

test:
  imports:
    - predictr
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://tvtoglu.github.io/predictr/
  summary: Life Data Analysis for Reliability Engineers - Weibull Analysis, Detailed Plots, Compute Statistics
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  doc_url: https://tvtoglu.github.io/predictr/classes/
  dev_url: https://github.com/tvtoglu/predictr

extra:
  recipe-maintainers:
    - kellend-git
